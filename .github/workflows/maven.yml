# This workflow will build a Java project with Maven
# For more information see: https://help.github.com/actions/language-and-framework-guides/building-and-testing-java-with-maven

name: Java CI with Maven

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  schedule:
    - cron: "0 4 * * 6" # create a release every Saturday at 4:00 UTC
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        # test against latest update of each major Java version:
        java: [ 8, 11, 17, 21, 25 ]
    name: Build with Java ${{ matrix.java }}
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v5
      - name: Setup java
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: ${{ matrix.java }}
          java-package: jdk+fx
          cache: 'maven'
      - name: Build with Maven
        run: ./mvnw -B package

  new_release_version:
    name: Increment Release Version
    runs-on: ubuntu-24.04
    permissions:
      contents: write  # Needed to commit changes
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    timeout-minutes: 30
    steps:
      - id: checkout
        name: Checkout sources
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.PERSONAL_ACCESS_TOKEN }}  # Checking out GIT repo using PAT allows to re-triggering the workflow
          persist-credentials: false  # Ensures the supplied token is used for subsequent Git operations
          fetch-depth: 0  # Full history and tags, needed to check for changes since the last release
      - id: extract_version
        name: Extract Version
        run: |
          #------------------------------------------------------
          # getting current release version no from Maven Central
          # (OSSRH / oss.sonatype.org was shut down in 2025)
          #------------------------------------------------------
          curr_version=$(curl -gL https://repo1.maven.org/maven2/com/actelion/research/openchemlib/maven-metadata.xml -s | grep release | sed -n 's/.*<release>\(.*\)<\/release>.*/\1/p')
          # abort instead of silently creating a wrong version no (e.g. YEAR.MONTH.0 that may already exist)
          if [ -z "${curr_version}" ]; then
            echo "::error::Could not read the current release version from Maven Central"
            exit 1
          fi
          IFS='.- ' read -r -a tokens <<< ${curr_version}
          curr_year=${tokens[0]}
          curr_month=${tokens[1]}
          curr_build=${tokens[2]}
          echo curr_version: ${curr_version}
          #------------------------------------------------------
          # skip the weekly release if nothing changed since the last release:
          # count commits after the release tag, ignoring the automatic version bump commits.
          # Only applies to the schedule; a manual run (workflow_dispatch) always creates a release.
          # If the tag is missing, a release is created to be on the safe side.
          #------------------------------------------------------
          if [ "${{ github.event_name }}" == "schedule" ] && git rev-parse -q --verify "refs/tags/${curr_version}" > /dev/null; then
            changes=$(git log --oneline --invert-grep --grep='^Incremented version to' "${curr_version}..HEAD" | wc -l)
            echo "commits since ${curr_version}: ${changes}"
            if [ "${changes}" -eq 0 ]; then
              echo "::notice::No changes since release ${curr_version}, skipping release"
              echo "skip_release=true" >> $GITHUB_ENV
              exit 0
            fi
          fi
          #------------------------------------------------------
          # creating a new version no
          #------------------------------------------------------
          new_year=$(date +%Y)
          new_month=$(date +%m)
          new_month=${new_month#0}
          new_build=0
          if [ "$new_year" == "$curr_year" ] && [ "$new_month" == "$curr_month" ]; then
          new_build=$((curr_build+1))
          fi
          new_version=${new_year}.${new_month}.${new_build}
          echo new_version: ${new_version}
          #------------------------------------------------------
          
          echo "new_version=${new_version}" >> $GITHUB_ENV
      - id: set_release_version
        name: Set next release version
        if: ${{ env.skip_release != 'true' }}
        run: |
          ./mvnw versions:set -DnewVersion=${new_version} -DgenerateBackupPoms=false
          git config user.name "GitHub Actions"
          git config user.email "github-actions@users.noreply.github.com"
          git remote set-url origin https://x-access-token:${{ secrets.PERSONAL_ACCESS_TOKEN }}@github.com/Actelion/openchemlib.git
          git commit -am "Incremented version to ${new_version}"
          git push

  deploy:
    name: Deploy with Java 8
    if: github.event_name == 'push'
    needs: build  # only deploy if the build succeeded with all Java versions of the matrix
    # never run two deployments at the same time (e.g. after two quick pushes): a second run waits
    # for the first one to finish instead of publishing and pushing version commits in parallel
    concurrency:
      group: deploy-${{ github.ref }}
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    permissions:
      contents: write  # Needed to commit changes
    timeout-minutes: 30
    steps:
      - id: checkout
        name: Checkout sources
        uses: actions/checkout@v5
      - id: setup_jdk
        name: Set up JDK 8
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '8'
          java-package: jdk+fx
          cache: maven
          server-id: central # Value of the distributionManagement/repository/id field of the pom.xml
          server-username: MAVEN_USERNAME # env variable for username in deploy
          server-password: MAVEN_PASSWORD # env variable for token in deploy
          gpg-private-key: ${{ secrets.GPG_SECRET_KEY }} # Value of the GPG private key to import
          gpg-passphrase: MAVEN_GPG_PASSPHRASE # env variable for GPG private key passphrase
      - id: extract_version
        name: Extract Version
        run: |
          #------------------------------------------------------
          # getting current version no from pom.xml
          #------------------------------------------------------               
          curr_version=$(./mvnw help:evaluate -Dexpression=project.version -q -DforceStdout)
          IFS='.- ' read -r -a tokens <<< ${curr_version}
          curr_year=${tokens[0]}
          curr_month=${tokens[1]}
          curr_build=${tokens[2]}
          echo curr_version: ${curr_version}
          # make version available to the next steps
          echo "curr_version=${curr_version}" >> $GITHUB_ENV
          #------------------------------------------------------
          # creating a new snapshot version no
          #------------------------------------------------------
          new_build=$((curr_build+1))

          new_version=${curr_year}.${curr_month}.${new_build}-SNAPSHOT
          echo new_version: ${new_version}
          # make version available to the next steps
          echo "new_version=${new_version}" >> $GITHUB_ENV
          #------------------------------------------------------
      - id: publish_artifacts
        name: Publish Artifacts
        env:
          MAVEN_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.CENTRAL_TOKEN }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_SECRET_KEY_PASSWORD }}
        run: |
          ./mvnw \
            --no-transfer-progress \
            --batch-mode \
            --activate-profiles enable-sign-artifacts \
            deploy
      - id: create_tag
        name: Create Tag
        if: ${{ !contains(env.curr_version,'SNAPSHOT') }}
        run: |
          git config user.name "GitHub Actions"
          git config user.email "github-actions@users.noreply.github.com"
          git tag ${curr_version}
          git push origin ${curr_version}
      - id: create-release
        name: Create Release
        if: ${{ !contains(env.curr_version,'SNAPSHOT') }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.curr_version }}
          files: |
            target/*.jar
            LICENSE
      - id: set_snapshot_version
        name: Set next snapshot Version
        if: ${{ !contains(env.curr_version,'SNAPSHOT') }}
        run: |
          ./mvnw versions:set -DnewVersion=${new_version} -DgenerateBackupPoms=false
          git config user.name "GitHub Actions"
          git config user.email "github-actions@users.noreply.github.com"
          git commit -am "Incremented version to ${new_version}"
          git push
